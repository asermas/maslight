[package]
name = "maslight-capture"
description = "MasLight screen capture backends for Windows, X11 and PipeWire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Wayland capture through the xdg-desktop-portal screencast interface.
# Portal handshake only. Compiles anywhere with D-Bus.
portal = ["dep:ashpd", "dep:pollster", "dep:enumflags2"]
# Full Wayland capture. Needs libpipewire-0.3-dev at build time.
wayland = ["portal", "dep:pipewire"]

[dependencies]
maslight-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "randr"] }
libc = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"], optional = true }
pollster = { version = "1.0", optional = true }
enumflags2 = { version = "0.7", optional = true }
pipewire = { version = "0.10", optional = true }
