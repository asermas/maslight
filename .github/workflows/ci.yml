name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            libdbus-1-dev libasound2-dev pkg-config xvfb

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude maslight-app --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude maslight-app

      # The X11 backend cannot be unit tested: it needs a server. Under Xvfb it
      # can be exercised for real, which is the only place the Linux capture
      # path is actually run.
      - name: Live X11 capture
        if: runner.os == 'Linux'
        env:
          MASLIGHT_X11_TEST: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" cargo test -p maslight-capture --test x11_live -- --test-threads=1

  wayland:
    name: Wayland backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install PipeWire and portal headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev libasound2-dev \
            libx11-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            pkg-config clang

      # The Wayland backend needs libpipewire at build time, so it lives behind
      # a feature and gets its own job rather than slowing the main matrix.
      - name: Check the portal handshake
        run: cargo check -p maslight-capture --features portal

      - name: Check the PipeWire backend
        run: cargo clippy -p maslight-capture --features wayland -- -D warnings

  frontend:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Types and bundle
        run: npm run build
        working-directory: app

      - name: Icons are reproducible
        run: |
          node scripts/make-icons.mjs
          git diff --exit-code app/src-tauri/icons app/public assets/brand

  app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev \
            libx11-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            build-essential pkg-config

      - run: npm ci
        working-directory: app

      - run: npm run build
        working-directory: app

      - name: Build the app
        run: cargo build -p maslight-app
