name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            args: ""
          - os: ubuntu-22.04
            label: Linux packages
            args: ""

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev \
            libx11-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            build-essential pkg-config rpm

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: MasLight ${{ github.ref_name }}
          releaseBody: |
            Download the package for your system below.

            * Windows: the `.msi` or the `-setup.exe`
            * Debian and Ubuntu: the `.deb`
            * Fedora: the `.rpm`
            * Anything else: the `.AppImage`

            Nothing in this build phones home. See the privacy section of the
            README for what that means in practice.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
