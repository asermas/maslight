<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MasLight">
  <title>MasLight</title>
  <rect width="256" height="256" rx="56" fill="#0B0D10"/>

  <!-- The monogram: one continuous stroke, drawn as an M. -->
  <path d="M56 188 V72 L128 142 L200 72 V188"
        fill="none"
        stroke="#F5F7FA"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Three LEDs on the strip below, sampled from the spectrum. -->
  <circle cx="56"  cy="220" r="12" fill="#FF4D4D"/>
  <circle cx="128" cy="220" r="12" fill="#4DFF9E"/>
  <circle cx="200" cy="220" r="12" fill="#4DA6FF"/>
</svg>
